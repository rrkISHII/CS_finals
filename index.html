<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Snap Demo</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/playground.css">
</head>
<body>

  <!-- header -->
  <div class="header"></div>

  <main class="container">

    <!-- section 1 - the game -->
    <div class="section">
      <div class="section-child">
      <div class="section-grid-half">  
        <div class="section1-left">
          <div class="game-title"></div>
          <div class="game-icon"></div>
        </div>

        <div class="section1-right">
          <div class="game-textarea"></div>
          

        </div>

      </div>
      </div>
    </div>

    <!-- section 2 - trailer -->
    <div class="section">
      <div class="section-child">
      <div class="section-grid-whole">
        
          <div class="section2-title"></div>

          <div class="trailer-vid"></div>
          

      </div>
      </div>
    </div>

    <!-- section 3 -  --> 
    <!-- CLEAR THE HORDE -->
    <!-- MEDIA OF ENEMIES  -->
    <!-- SMASH< DASH, ATTACK,  -->
    <div class="section">
      <div class="section-child">
        <div class="section-grid-half">

          <div class="section3-left">
              <div class="section3-title"></div>
              <div class="section3-media"></div>
          </div>

          <div class="section3-right">
              <div class="container-buttons">
                  <div class="buttons"></div>
                  <div class="buttons"></div>
                  <div class="buttons"></div>
                  <div class="buttons"></div>
                  <div class="buttons"></div>
              </div>
          </div>

        </div>
      </div>
    </div>

    <!-- FORGE YOUR BUILD -->
    <!-- MEDIA OF UPGRADES, and menu upgrade -->
    <div class="section">
      <div class="section-child">
        <div class="section-grid-half">

          <div class="section4-left">

            <div class="section3-title"></div>
              <div class="section3-media"></div>

          </div>

          <div class="section4-right">
          
              <div class="container-buttons">
                  <div class="buttons"></div>
                  <div class="buttons"></div>
                  <div class="buttons"></div>
              </div>
          
          </div>

        </div>
      </div>

    </div>

    <!-- BEAT UP THE BOSS -->
    <!-- MEDIA OF BOSS INTRODUCITON -->
    <div class="section">
      <div class="section-child">
        <div class="section-grid-half">

          <div class="section5-left">

            <div class="section3-title"></div>
            <div class="section3-media"></div>

          </div>

          

          <div class="section5-right">
            <div class="container-buttons">
                  <div class="buttons"></div>
                  <div class="buttons"></div>
                  <div class="buttons"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- section 4 - MINIGAME -->
    <div class="section">
      <div class="section-child">
        <div class="minigame-container">
          <div class="minigame">
          <!-- ATTACKS -->

          <!-- START BUTTON -->
          </div>
        </div>
      </div>
    </div>

    <!-- footer sect -->
    <div class="section">
      <div class="section-child">
        <div class="footer-parent">
          <div class="footer-middle"></div>


        </div>

      </div>
    </div>
  </main>

</body>
</html>
